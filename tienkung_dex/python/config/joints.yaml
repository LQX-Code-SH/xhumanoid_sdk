# ─────────────────────────────────────────────────────────────────────────────
# home2 参考模块 —— 半身运控模式（上肢运动接口开放前）站立快照
#
# 场景：真机开放上肢（arm）运动接口前，须先把机器人切换到"半身运控模式"
# （下半身运控保持站立/平衡，上肢关节释放给外部 POSITION 控制）。该模式下
# 机器人会稍作下蹲——对照上方 home_standing（普通站立，2026-09-03 早前
# 快照）可见腿部差异明显：髋 pitch 51 −0.144→−0.335 / 61 −0.147→−0.352，
# 膝 pitch 54 +0.368→+0.586 / 64 +0.341→+0.550（下蹲加深 ~20°），踝 pitch
# 55 −0.167→−0.247 / 65 −0.137→−0.154；臂/腰差异微小（14 −0.496→−0.500、
# 24 −0.361→−0.363），故 demo 动作仍以当帧现场读数为基准即可。
#
# 结构同 home_standing：键 = 关节 id；值 = 半身运控模式下读数（rad）。
# 与关节参数表分开维护，loader 同样忽略此非 list 块。
# ─────────────────────────────────────────────────────────────────────────────
